    <meta charset="UTF-8" />

    />

  <body>
    <div class="d-flex justify-content-around p-3 align-items-center">
      <h2>Dashboard Page</h2>

      <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>

      <!-- <button id="getSingleUserBtn">Get Single User</button>
    <button id="getAllUserBtn">Get All Users</button> -->
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">
              Modal title
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"
                >User Name</label
              >
              <input
                type="text"
                class="form-control"
                id="userName"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="exampleInputEmail1"
                aria-describedby="emailHelp"
              />
            </div>

            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label"
                >Password</label
              >
              <input
                type="password"
                class="form-control"
                id="exampleInputPassword1"
              />
            </div>

            <div class="mb-3">
              <input class="form-control" type="file" id="formFile" />
            </div>

            <div class="form-floating">
              <textarea class="form-control" id="floatingTextarea"></textarea>
              <label for="floatingTextarea">Description</label>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" id="saveBtn">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <div
      class="pappa d-flex flex-wrap gap-5 mt-5 mb-5 align-items-center justify-content-center"
    >
