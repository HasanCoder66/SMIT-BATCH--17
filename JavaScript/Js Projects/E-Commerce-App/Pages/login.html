<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/Styles/signup.css">
</head>
<body>
    
    <!-- From Uiverse.io by Yaya12085 --> 
<form class="form">
    <p class="title">Login </p>
    <p class="message">Login now and get full access to our app. </p>
    
            
    <label>
        <input required  placeholder="" type="email" class="input" id="email">
        <span>Email</span>
    </label> 
        
    <label>
        <input required placeholder="" type="password" class="input" id="password">
        <span>Password</span>
    </label>
    
    <button class="submit">Login</button>
    <p class="signin">Don't have an acount ? <a href="signup.html">Signup</a> </p>
</form>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/JavasSript/login.js"></script>
</body>
</html>
