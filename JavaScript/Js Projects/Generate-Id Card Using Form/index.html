<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Id-Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="formBox">
        <h1 class="text-center">Student Form</h1>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Student Full Name</label>
            <input type="text" class="form-control fullName" id="exampleFormControlInput1" placeholder="Enter Your Full Name">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Email address</label>
            <input type="email" class="form-control email" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Student Course Name</label>
            <input type="text" class="form-control studentCourseName" id="exampleFormControlInput1" placeholder="Student Course Name">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Roll Number</label>
            <input type="number" class="form-control rollNumber" id="exampleFormControlInput1" placeholder="Roll Number">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Student Batch</label>
            <input type="number" class="form-control studentBatch" id="exampleFormControlInput1" placeholder="Student Batch">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label ">Student Image</label>
            <input type="file" class="form-control studentImage" id="exampleFormControlInput1" placeholder="Student Image ">
        </div>

        <div class="d-flex justify-content-center">
            <button onclick="studentFormHandler()" type="button" class="btn btn-primary w-100">Generate Id Card</button>
        </div>
    </div>

   <div id="idCard">

   </div>



    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
